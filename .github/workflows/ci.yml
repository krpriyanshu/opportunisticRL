name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (dev extras)
        run: pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      # No continue-on-error: the tree type-checks clean, so a new type
      # error is a real regression and should fail the build rather than
      # be recorded as a green tick with a warning nobody reads.
      - name: Type check (mypy)
        run: mypy src/opportunity_rl

      - name: Test
        run: pytest -v
